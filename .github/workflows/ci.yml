# Fase 10: CI for the biometric engine (lint + test + docker build).
#
# Triggers on every push to main and every pull request, so the next push
# to main runs this workflow for real. Keep every command below byte-equal
# to the local parity run (see biometric_engine/docs/deployment.md):
# the CI job must reproduce what already passes locally.
name: biometric-engine CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biometric_engine
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: biometric_engine/requirements.txt
      - name: Install runtime + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-cov>=5.0" "pytest-asyncio>=0.23" "pytest-mock>=3.12" "ruff>=0.4" "mypy>=1.10"
      - name: ruff check
        run: python -m ruff check app/ tests/
      - name: mypy
        run: python -m mypy app/

  test:
    name: test (pytest + coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biometric_engine
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biometric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biometric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Pydantic Settings reads process env first, so these override .env.
      # conftest derives the test DB by swapping the path to /biometric_test.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/biometric
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: biometric_engine/requirements.txt
      - name: Install runtime + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-cov>=5.0" "pytest-asyncio>=0.23" "pytest-mock>=3.12" "ruff>=0.4" "mypy>=1.10"
      - name: pytest with coverage gate
        # Floor measured at 93% on 2026-10-13 (71 passed); gate set to 90
        # per the Fase 10 plan (raise toward 100 in Fase 11).
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=90

  build:
    name: build (docker)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      # Heavy wheels (insightface/mediapipe/onnxruntime) make this take
      # ~10-15 min on a cold cache; layer caching is a future improvement.
      - name: Build API image
        run: docker build -f biometric_engine/docker/Dockerfile biometric_engine
