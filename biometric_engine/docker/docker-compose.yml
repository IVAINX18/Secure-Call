services:
  biometric-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Host port is env-overridable for tenants sharing a host.
      # Canonical default 8000; local QA uses 8800 (host 8000 is taken).
      - "${API_PORT:-8000}:8000"
    environment:
      # Container-internal URLs are hardcoded: service DNS names only exist
      # inside the compose network. A host-oriented .env (localhost URLs for
      # local dev) must never leak in here — dev-start.sh forwards .env only
      # for the host-level knobs below (ports, secrets, thresholds).
      DATABASE_URL: postgresql+asyncpg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      BIOMETRIC_THRESHOLD: ${BIOMETRIC_THRESHOLD:-0.85}
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # stdlib-only probe: no curl in python:3.11-slim.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    volumes:
      # Optional: test fixtures available inside the container for smoke QA.
      - ../tests/fixtures:/fixtures:ro

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biometric}
      POSTGRES_USER: ${POSTGRES_USER:-biometric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biometric} -d ${POSTGRES_DB:-biometric}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
